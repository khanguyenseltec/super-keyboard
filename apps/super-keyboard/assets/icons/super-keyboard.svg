  <g fill="none" stroke="url(#glyph)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round">
    <path d="M206 140c-30 0-40 11-40 38v26c0 16-9 24-29 24 20 0 29 8 29 24v26c0 27 10 38 40 38"/>
    <path d="M306 140c30 0 40 11 40 38v26c0 16 9 24 29 24-20 0-29 8-29 24v26c0 27-10 38-40 38"/>
