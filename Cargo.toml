[workspace]
resolver = "3"
members = ["crates/core", "crates/config", "apps/super-keyboard", "apps/super-keyboard-ibus"]
default-members = ["crates/core", "crates/config"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tristanseltec/super-keyboard"
authors = ["Super Keyboard contributors"]

[workspace.dependencies]
super-keyboard-core = { path = "crates/core" }
super-keyboard-config = { path = "crates/config" }
dioxus = { version = "0.7.10" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# `dx` builds these profiles for web/desktop/android; keep them as small as release.
[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
