name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  desktop:
    name: Format, lint and test (Ubuntu desktop)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Dioxus desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            libxdo-dev libssl-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace

  ibus:
    name: Vietnamese input method through a real IBus
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install IBus and its Python bindings
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ibus python3-gi gir1.2-ibus-1.0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p super-keyboard-ibus
      # A private ibus-daemon: the packaged component file, then run-time registration.
      - run: apps/super-keyboard-ibus/tests/e2e.sh component
      - run: apps/super-keyboard-ibus/tests/e2e.sh register

  android-core:
    name: Engine and config build for Android targets
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - run: |
          for target in aarch64-linux-android armv7-linux-androideabi x86_64-linux-android; do
            cargo check -p super-keyboard-core -p super-keyboard-config --target "$target"
          done

  web:
    name: Browser preview builds (wasm)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p super-keyboard --no-default-features --features web --target wasm32-unknown-unknown
