[package]
name = "super-keyboard"
description = "A developer-focused virtual keyboard for Ubuntu desktop and Android."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
super-keyboard-core.workspace = true
super-keyboard-config.workspace = true
dioxus.workspace = true
# A monotonic clock that also works in the browser preview.
web-time = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Timers for long-press and key repeat; Dioxus desktop and mobile run on Tokio.
tokio = { version = "1", features = ["time"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers = { version = "0.3", features = ["futures"] }

[features]
default = ["desktop"]
# `dx serve --desktop` / `dx serve --android` enable these.
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
# Browser preview: handy for layout work, not a shipping target.
web = ["dioxus/web"]

[lints]
workspace = true

[dev-dependencies]
dioxus-ssr = "0.7.10"
tempfile = "3"
