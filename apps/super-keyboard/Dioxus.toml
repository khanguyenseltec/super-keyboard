[application]
name = "Super Keyboard"

[bundle]
identifier = "io.github.tristanseltec.superkeyboard"
# Rendered from docs/brand by docs/brand/build.py; installed into the hicolor theme.
icon = [
    "assets/icons/16x16.png",
    "assets/icons/24x24.png",
    "assets/icons/32x32.png",
    "assets/icons/48x48.png",
    "assets/icons/64x64.png",
    "assets/icons/128x128.png",
    "assets/icons/256x256.png",
    "assets/icons/512x512.png",
    "assets/icons/super-keyboard.svg",
]
publisher = "Super Keyboard contributors"
category = "Utility"
short_description = "A developer-focused virtual keyboard."
long_description = """
Super Keyboard puts brackets, operators, Esc, Tab, Ctrl, arrows and F-keys where
programmers need them, with layouts defined as code.
"""

# The .deb also installs the Vietnamese input method for IBus, so the physical
# keyboard types Telex, VNI or VIQR in every application, in sync with the app.
# Build it first: cargo build --release -p super-keyboard-ibus
[bundle.deb]
recommends = ["ibus"]
post_install_script = "../super-keyboard-ibus/packaging/postinst"
post_remove_script = "../super-keyboard-ibus/packaging/postrm"

[bundle.deb.files]
"/usr/libexec/super-keyboard-ibus" = "../../target/release/super-keyboard-ibus"
"/usr/share/ibus/component/super-keyboard.xml" = "../super-keyboard-ibus/data/super-keyboard.xml"
